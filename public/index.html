<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notes — by Optiq Labs</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body data-view="docs">
  <div class="app">
    <aside class="sidebar">
      <header>
        <h1 class="brand">Notes <span class="brand-sub">by Optiq Labs</span></h1>
        <button id="new-doc" class="primary" title="New document">＋ New</button>
      </header>
      <ul id="doc-list" class="doc-list"></ul>
      <div class="assets-section">
        <h2>Assets <button id="upload-asset" style="float:right">Upload</button></h2>
        <input id="asset-file" type="file" hidden />
        <ul id="asset-list" class="asset-list"></ul>
      </div>
      <div class="account-section">
        <div class="account-bar">
          <span id="user-email" class="user-email"></span>
          <button id="logout">Log out</button>
        </div>
      </div>
    </aside>

    <section class="editor-pane">
      <div class="pane-header">
        <input id="title" type="text" placeholder="Title" disabled />
        <button id="save" class="primary" disabled>Save</button>
        <button id="delete-doc" disabled>Delete</button>
      </div>
      <textarea id="content" placeholder="Write markdown here — use ```mermaid and ```excalidraw fences for diagrams." disabled></textarea>
    </section>

    <section class="preview-pane">
      <div class="pane-header">
        <span>Preview</span>
        <span id="status"></span>
        <button id="share" disabled>Share view-only</button>
      </div>
      <div id="preview" class="rendered">
        <div class="empty-state">Select or create a document to get started.</div>
      </div>
    </section>
    <nav class="mobile-nav" aria-label="Views">
      <button data-view="docs" class="active">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        Docs
      </button>
      <button data-view="edit">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        Edit
      </button>
      <button data-view="preview">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
        Preview
      </button>
    </nav>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
