<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)" />
    <!-- Sets the theme class before first paint so a dark-mode user never sees
         a white flash. Must stay in sync with STORAGE_KEY and DARK_CLASS in
         src/hooks/useTheme.ts. Touches only documentElement.classList, which is
         outside React's hydration root, so it cannot cause a mismatch. -->
    <script>
      (function () {
        try {
          var c = localStorage.getItem("notes:theme");
          var dark =
            c === "dark" ||
            ((c === "system" || !c) && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark-mode");
        } catch (e) {
          /* private mode: fall through to light */
        }
      })();
    </script>
    <!-- Icons. All generated from brand/mark.svg by brand/build-assets.mjs;
         re-run that after changing the artwork rather than editing by hand.
         The SVG is listed first and themes itself via prefers-color-scheme;
         the PNGs are fallbacks for browsers that ignore SVG favicons. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>Notes — by Optiq Labs</title>
    <meta name="description" content="The workspace Claude actually keeps your documents in. Connect Notes to Claude over MCP and every document, Mermaid diagram, and Excalidraw sketch it creates lives in one organized, shareable place — something Google Docs and Claude's own chat can't do." />
    <meta property="og:title" content="Notes — the workspace Claude actually keeps your documents in" />
    <meta property="og:description" content="Connect Notes to Claude over MCP. Every document, Mermaid diagram, and Excalidraw sketch it creates lives in one organized place you can edit and share." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Notes by Optiq Labs" />
    <!-- Social crawlers run no JavaScript and reject SVG, so this must be a
         real PNG at an absolute URL. Phase 7's prerender step rewrites the
         origin per environment; this default covers local and preview. -->
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Notes by Optiq Labs — the workspace Claude actually keeps your documents in." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
